name: Blog agent publish

# Portfolio blog agent is a Vercel route (/api/cron/blog-agent), not a repo script.
# Vercel Cron is scheduled daily at 10:00 UTC in vercel.json, but Hobby timing is
# unreliable and misses can leave Mon/Wed/Fri empty. This workflow is the backup
# trigger on publish weekdays (and manual runs).

on:
  schedule:
    # Mon / Wed / Fri 10:15 UTC (after the Vercel cron window)
    - cron: "15 10 * * 1,3,5"
  workflow_dispatch:
    inputs:
      force:
        description: "Force publish even if already ran today"
        required: false
        default: "0"
        type: choice
        options:
          - "0"
          - "1"

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Trigger blog agent
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL_VAR: ${{ vars.SITE_URL }}
          FORCE: ${{ github.event.inputs.force || '0' }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET}" ]; then
            echo "CRON_SECRET is missing in repo secrets. Add the same value as Vercel CRON_SECRET."
            exit 1
          fi
          URL="https://alihamza-fawn.vercel.app"
          if [ -n "${SITE_URL_VAR}" ]; then
            URL="${SITE_URL_VAR%/}"
          fi
          ENDPOINT="${URL}/api/cron/blog-agent"
          if [ "${FORCE}" = "1" ]; then
            ENDPOINT="${ENDPOINT}?force=1"
          fi
          echo "POST ${ENDPOINT}"
          body="$(curl -fsS --max-time 280 -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            "${ENDPOINT}")"
          echo "$body"
          echo "$body" | grep -q '"ok":true'
