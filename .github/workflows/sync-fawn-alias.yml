name: Sync fawn production alias

# Keep https://alihamza-fawn.vercel.app on each main Production deploy.
# That short URL is the public / social link. Vercel’s auto Production host is the
# long *-alilogics007s-projects.vercel.app name and cannot be renamed to "fawn".
# This job only runs after the matching commit is READY (no early wrong alias).

on:
  push:
    branches: [main]
  deployment_status:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Optional git SHA to wait for (default: latest main HEAD)"
        required: false
        type: string

concurrency:
  group: sync-fawn-alias
  cancel-in-progress: false

jobs:
  sync-alias:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: >
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' &&
       (github.event.deployment.environment == 'Production' ||
        github.event.deployment.environment == 'production'))
    steps:
      - name: Resolve target commit
        id: target
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "deployment_status" ]; then
            SHA="${{ github.event.deployment.sha }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.commit_sha }}" ]; then
            SHA="${{ inputs.commit_sha }}"
          else
            SHA="${{ github.sha }}"
          fi
          SHA=$(echo "$SHA" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')
          if [ -z "$SHA" ] || [ ${#SHA} -lt 7 ]; then
            echo "Could not resolve a commit SHA to wait for."
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Waiting for Production deploy of $SHA"

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Point alihamza-fawn.vercel.app at this commit's Production deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "Missing VERCEL_TOKEN secret."
            exit 1
          fi

          SCOPE="alilogics007s-projects"
          PROJECT="alihamza"
          ALIAS="alihamza-fawn.vercel.app"
          API="https://api.vercel.com"
          DEPLOY_URL=""

          TEAM_JSON=$(curl -fsS -H "Authorization: Bearer $VERCEL_TOKEN" \
            "$API/v2/teams?slug=$SCOPE" || true)
          TEAM_ID=$(echo "$TEAM_JSON" | node -e '
            let s=""; process.stdin.on("data",d=>s+=d); process.stdin.on("end",()=>{
              try {
                const j=JSON.parse(s);
                const t=(j.teams||[]).find(x=>x.slug==="alilogics007s-projects") || (j.teams||[])[0];
                process.stdout.write(t && t.id ? t.id : "");
              } catch { process.stdout.write(""); }
            });
          ')

          echo "Polling for READY production deploy matching $TARGET_SHA ..."
          for attempt in $(seq 1 40); do
            QS="projectId=$PROJECT&target=production&state=READY&sha=$TARGET_SHA&limit=5"
            if [ -n "$TEAM_ID" ]; then
              QS="$QS&teamId=$TEAM_ID"
            else
              QS="$QS&slug=$SCOPE"
            fi

            RESP=$(curl -fsS -H "Authorization: Bearer $VERCEL_TOKEN" \
              "$API/v6/deployments?$QS" || echo '{}')

            PARSE=$(echo "$RESP" | TARGET_SHA="$TARGET_SHA" node -e '
              let s=""; process.stdin.on("data",d=>s+=d); process.stdin.on("end",()=>{
                try {
                  const j=JSON.parse(s);
                  const want=(process.env.TARGET_SHA||"").toLowerCase();
                  const list=j.deployments||[];
                  for (const d of list) {
                    const meta=d.meta||{};
                    const sha=(meta.githubCommitSha||meta.gitCommitSha||"").toLowerCase();
                    const ready=(d.state==="READY"||d.readyState==="READY");
                    const url=d.url ? "https://"+d.url.replace(/^https?:\/\//,"") : "";
                    if (ready && sha && (sha===want || sha.startsWith(want) || want.startsWith(sha)) && url) {
                      process.stdout.write(url);
                      return;
                    }
                  }
                  process.stdout.write("");
                } catch { process.stdout.write(""); }
              });
            ')

            if [ -n "$PARSE" ]; then
              DEPLOY_URL="$PARSE"
            fi

            if [ -z "$DEPLOY_URL" ]; then
              OUT=$(vercel ls "$PROJECT" --prod --token "$VERCEL_TOKEN" --scope "$SCOPE" \
                -m "githubCommitSha=$TARGET_SHA" 2>&1 || true)
              if echo "$OUT" | grep -qiE 'token.*(rejected|invalid)|unauthorized|not authorized'; then
                echo "VERCEL_TOKEN rejected."
                echo "$OUT" | head -20
                exit 1
              fi
              DEPLOY_URL=$(echo "$OUT" | awk '
                /● Ready/ {
                  for (i = 1; i <= NF; i++) {
                    if ($i ~ /^https:\/\/alihamza-[a-z0-9]+-alilogics007s-projects\.vercel\.app$/) {
                      print $i
                      exit
                    }
                  }
                }
              ')
            fi

            if [ -n "$DEPLOY_URL" ]; then
              echo "Found READY deploy for $TARGET_SHA: $DEPLOY_URL"
              break
            fi

            if [ "$attempt" -eq 1 ] || [ $((attempt % 5)) -eq 0 ]; then
              echo "--- attempt $attempt: not READY yet for $TARGET_SHA ---"
            fi
            sleep 15
          done

          if [ -z "$DEPLOY_URL" ]; then
            echo "Timed out waiting for READY production deployment of $TARGET_SHA."
            exit 1
          fi

          echo "Aliasing $ALIAS -> $DEPLOY_URL"
          vercel alias set "$DEPLOY_URL" "$ALIAS" --token "$VERCEL_TOKEN" --scope "$SCOPE"
          sleep 2
          curl -fsSIL "https://$ALIAS/" | head -15
          echo "Done. Public short URL tracks $TARGET_SHA."
